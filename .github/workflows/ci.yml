name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: docker://yamllint/yamllint:latest
        with:
          args: --strict .

      - name: Check Python syntax
        run: python3 -m py_compile app/app.py

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -f app/Dockerfile app

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 app/

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [validate, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d

      - name: Generate test traffic
        run: |
          sleep 10
          curl -sf http://localhost:8080/ || echo "App not yet ready"
          curl -sf http://localhost:8080/healthz || echo "Healthz not yet ready"

      - name: Stop services
        if: always()
        run: docker compose down -v
